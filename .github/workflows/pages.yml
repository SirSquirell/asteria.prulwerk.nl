name: Deploy Pages

# Bouwt en publiceert de site. De versie in de footer komt niet uit deze
# repo: manifest.json leeft in SirSquirell/Claudiclaude, dus die repo wordt
# hier ook gecheckout en tools/inject-version.mjs krijgt het pad ernaartoe.
#
# Eenmalige handmatige stap die hierbij hoort en die deze workflow niet zelf
# kan zetten: Settings > Pages > Build and deployment > Source moet op
# "GitHub Actions" staan in plaats van "Deploy from a branch". Zonder die
# omzetting draait deze workflow wel, maar publiceert Pages nog steeds de
# ongebouwde inhoud van de branch.
#
# Wat niet in de stap "Site samenstellen" staat wordt niet gepubliceerd: een
# nieuw bestand voor de site moet daar ook bij.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asteria.prulwerk.nl
        uses: actions/checkout@v4

      - name: Checkout Claudiclaude (alleen manifest.json)
        uses: actions/checkout@v4
        with:
          repository: SirSquirell/Claudiclaude
          path: claudiclaude
          sparse-checkout: manifest.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Versie injecteren
        run: node tools/inject-version.mjs --manifest claudiclaude/manifest.json

      - name: Site samenstellen (allowlist, de rest gaat niet mee)
        run: |
          mkdir _site
          cp index.html handleiding.html og.png robots.txt sitemap.xml CNAME \
             favicon.svg favicon-light.svg favicon-32.png apple-touch-icon.png _site/
          cp -r fonts _site/fonts
          ls -R _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Mislukt build of deploy, dan komt er een issue in deze repo met de link naar
  # de run, zodat een kapotte publicatie niet alleen in het Actions-tabblad
  # staat. Staat er al een open issue met deze titel, dan komt er geen tweede.
  melden:
    needs: [build, deploy]
    if: failure()
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Issue openen als er nog geen open staat
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search '"Deploy Pages mislukt" in:title' --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "Er staat al een open issue, geen nieuwe aangemaakt."
            exit 0
          fi
          gh issue create \
            --title "Deploy Pages mislukt" \
            --body "De workflow Deploy Pages is mislukt. Log: $RUN_URL"
